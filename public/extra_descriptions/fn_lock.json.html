<p>
  Press <kbd>Fn</kbd>+<kbd>Esc</kbd> to toggle Fn Lock. When Fn Lock is on,
  the top row sends <kbd>F1</kbd>&ndash;<kbd>F12</kbd>; when it is off, the top
  row keeps its normal media-key behavior.
</p>

<p>
  In macOS Keyboard settings, configure the top row to use media keys by
  default. The rule adds a short notification when the mode changes.
</p>
